<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VAT Q Calc</title>
    
    <!-- Apple Web App Tags for Offline/Native App Behavior -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="VAT Q Calc">

    <style>
        body { font-family: -apple-system, sans-serif; background: #f2f2f7; padding: 20px; display: flex; justify-content: center; }
        .box { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 360px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h2 { text-align: center; margin-top: 0; font-size: 1.3rem; color: #1c1c1e; margin-bottom: 20px; }
        .input-wrapper { margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: bold; color: #8e8e93; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #d1d1d6; border-radius: 8px; font-size: 18px; box-sizing: border-box; background: #f2f2f7; font-weight: bold; }
        input:focus { outline: none; border-color: #007aff; background: white; }
        .line { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 16px; }
        .total { font-weight: bold; font-size: 19px; border-top: 1px solid #e5e5ea; padding-top: 12px; margin-top: 12px; }
        .vat-box { background: #fff9e6; border: 1px dashed #ffcc00; border-radius: 8px; padding: 12px; margin-top: 15px; margin-bottom: 15px; font-size: 14px; }
        .green { color: #34c759; font-weight: bold; }
        .red { color: #ff3b30; font-weight: bold; }
        .blue { color: #007aff; font-weight: bold; }
        .grey { color: #8e8e93; font-weight: 500; font-size: 14px; }
        .orange { color: #e68a00; font-weight: bold; font-size: 17px; }
    </style>
</head>
<body>

<div class="box">
    <h2>AutoTrader VAT Q Calc</h2>
    
    <div class="input-wrapper">
        <label>AUCTION BUY PRICE (INC. VAT)</label>
        <input type="number" id="auctionPriceGross" placeholder="e.g. 18000" inputmode="decimal" oninput="runCalc()">
    </div>

    <div class="input-wrapper">
        <label>AUTOTRADER TARGET PRICE (INC. VAT)</label>
        <input type="number" id="atPriceGross" placeholder="e.g. 24000" inputmode="decimal" oninput="runCalc()">
    </div>
    
    <div style="margin-top: 25px;">
        <div class="line">
            <span>Sale Price (Without VAT):</span>
            <span id="resSellNet" class="blue">£0.00</span>
        </div>
        <div class="line">
            <span>Auction Cost (Without VAT):</span>
            <span id="resBuyNet" class="grey">£0.00</span>
        </div>
        <div class="line">
            <span>VAT Reclaimable on Buy:</span>
            <span id="resBuyVat" class="grey">£0.00</span>
        </div>
        
        <!-- New Dedicated VAT Breakdown Box -->
        <div class="vat-box">
            <div class="line" style="margin-bottom: 6px;">
                <span>VAT Owed on Sale:</span>
                <span id="resSaleVat" style="color:#555;">£0.00</span>
            </div>
            <div class="line" style="margin-bottom: 0; font-weight: bold; border-top: 1px dotted #ffcc00; padding-top: 6px;">
                <span>Set Aside for HMRC:</span>
                <span id="resNetVatBill" class="orange">£0.00</span>
            </div>
        </div>

        <div class="line total">
            <span>True Net Profit Margin:</span>
            <span id="resProfit">£0.00</span>
        </div>
    </div>
</div>

<script>
function runCalc() {
    var auctionGross = parseFloat(document.getElementById('auctionPriceGross').value) || 0;
    var atGross = parseFloat(document.getElementById('atPriceGross').value) || 0;
    
    // Calculate net values (stripping out 20% VAT)
    var sellNet = atGross / 1.2;
    var buyNet = auctionGross / 1.2;
    
    // Calculate individual VAT elements
    var buyVat = auctionGross - buyNet;
    var saleVat = atGross - sellNet;
    
    // Net liability (VAT collected minus VAT paid out)
    var netVatBill = saleVat - buyVat;
    var netProfit = sellNet - buyNet;
    
    // Update display numbers
    document.getElementById('resSellNet').innerText = '£' + sellNet.toFixed(2);
    document.getElementById('resBuyNet').innerText = '£' + buyNet.toFixed(2);
    document.getElementById('resBuyVat').innerText = '£' + buyVat.toFixed(2);
    document.getElementById('resSaleVat').innerText = '£' + saleVat.toFixed(2);
    document.getElementById('resNetVatBill').innerText = '£' + netVatBill.toFixed(2);
    
    var profEl = document.getElementById('resProfit');
    profEl.innerText = '£' + netProfit.toFixed(2);
    
    // Color code the profit total
    if (netProfit > 0) {
        profEl.className = 'green';
    } else if (netProfit < 0) {
        profEl.className = 'red';
    } else {
        profEl.className = '';
    }
}

// --- Offline Storage Logic ---
if ('serviceWorker' in navigator) {
    const script = 'data:text/javascript;base64,' + btoa(`
        const cacheName = 'vat-q-v3';
        self.addEventListener('install', e => {
            e.waitUntil(caches.open(cacheName).then(cache => cache.addAll(['./'])));
        });
        self.addEventListener('fetch', e => {
            e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
        });
    `);
    navigator.serviceWorker.register(script);
}
</script>

</body>
</html>
